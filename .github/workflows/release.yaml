name: Release

on:
  push:
    tags:
      - "v*"

# Nothing may write by default; only the release job below can.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the GitHub release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Build release zip
        run: |
          cd custom_components/delonghi_daedalus
          zip -r ../../delonghi_daedalus.zip .

      - name: Detect prerelease from tag
        id: prerelease
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # SemVer 2.0: anything after `MAJOR.MINOR.PATCH-` is a prerelease
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Detected PRERELEASE tag: $TAG"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Detected STABLE tag: $TAG"
          else
            echo "::error::Tag does not match SemVer pattern vX.Y.Z[-suffix]" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          files: delonghi_daedalus.zip
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          make_latest: ${{ steps.prerelease.outputs.is_prerelease == 'false' }}
