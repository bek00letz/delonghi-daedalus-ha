name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  json:
    name: JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Validate JSON translations + manifest
        run: |
          python -c "
          import json, glob, sys
          errors = []
          paths = sorted(
              glob.glob('custom_components/*/translations/*.json')
              + glob.glob('custom_components/*/manifest.json')
              + ['hacs.json']
          )
          for f in paths:
              try:
                  json.load(open(f))
                  print(f'OK  {f}')
              except json.JSONDecodeError as e:
                  errors.append(f'{f}: {e}')
                  print(f'FAIL {f}: {e}')
          sys.exit(1 if errors else 0)
          "

  privacy:
    name: Privacy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # The general rules only (sign-in tokens, capture and log files): the
      # owner's protected values are fingerprinted locally and never uploaded.
      - name: Check for tokens and capture files
        run: python3 scripts/check_personal_info.py --check-all
